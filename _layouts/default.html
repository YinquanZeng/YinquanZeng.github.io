<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Yinquan's Blog</title>
  <style>
    /* 全局重置 & 基础样式 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #f6f8fa;
      color: #24292f;
      line-height: 1.7;
      padding: 0 1rem;
    }
    /* 容器居中，限制宽度，阅读舒适 */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 0;
    }
    /* 导航栏 */
    nav {
      background: #fff;
      padding: 1rem 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 2rem;
    }
    nav a {
      color: #24292f;
      text-decoration: none;
      margin-right: 1.5rem;
      font-weight: 500;
    }
    nav a:hover {
      color: #0969da;
      text-decoration: underline;
    }
    /* 卡片样式：首页、文章 */
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    /* 标题、段落、列表 */
    h1, h2, h3 {
      margin-bottom: 1rem;
      color: #111;
    }
    p {
      margin-bottom: 1rem;
    }
    ul {
      padding-left: 1.5rem;
      margin-bottom: 1rem;
    }
    /* 链接 */
    a {
      color: #0969da;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    /* 页脚 */
    footer {
      margin-top: 3rem;
      text-align: center;
      color: #656d76;
      font-size: 0.9rem;
    }
    /* 分割线 */
    hr {
      border: 0;
      height: 1px;
      background: #e5e7eb;
      margin: 1.5rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 导航 -->
    <nav>
      <a href="/">首页</a>
      <a href="/about/">关于我</a>
    </nav>

    <!-- 主体内容卡片 -->
    <div class="card">
      {{ content }}
    </div>

    <!-- 页脚 -->
    <footer>
      © 2025 Yinquan | Powered by Jekyll & GitHub Pages
    </footer>
  </div>
</body>
</html>
