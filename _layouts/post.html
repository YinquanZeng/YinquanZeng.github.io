---
layout: default
---

<h1>{{ page.title }}</h1>
<p style="color:var(--muted-color); font-size:0.95rem;">
  📅 {{ page.date | date: "%Y-%m-%d" }}
  ｜分类：{{ page.categories | join: ' / ' }}
</p>

{% if page.tags.size > 0 %}
<p style="color:var(--muted-color); font-size:0.95rem;">
  🏷️ 标签：
  {% for t in page.tags %}
  <span style="border:1px solid var(--border-color);padding:2px 6px;border-radius:4px;margin-right:4px;">
  {{ t }}
  </span>
  {% endfor %}
</p>
{% endif %}

<hr>
{{ content }}

<div style="margin-top:2rem;">
  <a href="/">← 返回首页</a>
</div>
